name: deploy-landing

# Builds the static landing site and publishes it to the public mirror
# repo (sawrozpdl/goserve-landing), whose gh-pages branch serves GitHub
# Pages. One-time setup: create the public mirror repo, add a write-access
# deploy key there, and store its private half here as the
# LANDING_DEPLOY_KEY secret (plus a PUBLIC_APP_URL repo variable).
#
# SITE/BASE below pin the build to the GitHub Pages project sub-path
# (astro.config now DEFAULTS to the real domain goserve.com.np at root).
# When the custom domain is live: drop the SITE/BASE overrides here (or set
# them to https://goserve.com.np + /) and add a CNAME file to publish_dir.

on:
  push:
    branches: [main]
    paths:
      - "apps/landing/**"
      - "packages/design-tokens/**"
      - "turbo.json"
      - ".github/workflows/deploy-landing.yml"
  workflow_dispatch:

concurrency:
  group: deploy-landing
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Pin to the GitHub Pages project sub-path until the custom domain is
      # live (astro.config defaults to https://goserve.com.np + /). Job-level
      # so the build and the post-build check can never disagree.
      # NOTE: turbo.json must list SITE/BASE/PUBLIC_* under the build task's
      # `env` — turbo's strict env mode drops anything undeclared.
      SITE: https://sawrozpdl.github.io
      BASE: /goserve-landing
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build landing site
        run: pnpm turbo run build --filter=@cafe-mgmt/landing
        env:
          # Accept the app origin from either the Variables or Secrets tab.
          PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL || secrets.PUBLIC_APP_URL }}
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL || secrets.PUBLIC_API_URL }}

      # A build that ignored BASE looks fine but serves a CSS-less page from a
      # sub-path, so fail here instead of publishing it.
      - name: Verify assets carry the deploy base
        run: |
          html=apps/landing/dist/index.html
          if ! grep -q "\"$BASE/_astro/" "$html"; then
            echo "::error::built assets are missing the '$BASE' prefix — SITE/BASE did not reach astro build (check turbo.json's build.env)"
            grep -oE '(href|src)="[^"]*_astro[^"]*"' "$html" | sort -u | head
            exit 1
          fi

      - name: Publish to mirror repo (GitHub Pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.LANDING_DEPLOY_KEY }}
          external_repository: sawrozpdl/goserve-landing
          publish_branch: gh-pages
          publish_dir: apps/landing/dist
          force_orphan: true
          commit_message: "deploy: ${{ github.sha }}"
