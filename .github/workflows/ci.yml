name: ci

on:
  push:
    # `prod` is the Coolify deploy branch — run the same gate there so
    # deploy-coolify.yml (workflow_run on ci success) only fires on green.
    branches: [main, prod]
  pull_request:

jobs:
  api:
    name: api (go)
    runs-on: ubuntu-latest

    # The integration suite (~1250 tests, incl. every money/accuracy assertion)
    # needs a real Postgres: it runs handlers through the same two-role setup as
    # production — migrations + fixtures as the superuser, handlers as app_user
    # with RLS enforced — so a missing GRANT or a broken policy fails here rather
    # than in prod. Without this service the suite skips itself and CI is green
    # while proving nothing.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cafe
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Superuser: migrations + test fixtures.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cafe?sslmode=disable
      # app_user is created by migration 0001 with a fixed dev password.
      APP_DATABASE_URL: postgresql://app_user:app_user@localhost:5432/cafe?sslmode=disable
      # Turns "no database" from a silent skip into a hard failure.
      REQUIRE_DB: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: apps/api/go.sum
      - name: vet
        run: cd apps/api && go vet ./...
      - name: build
        run: cd apps/api && go build ./...
      - name: migrate
        run: cd apps/api && go run ./cmd/migrate up
      - name: test
        run: cd apps/api && go test ./... -race -count=1

  web:
    name: web (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm typecheck
      - run: pnpm --filter @cafe-mgmt/web build
      - run: pnpm test
