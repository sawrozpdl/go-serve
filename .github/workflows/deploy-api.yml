name: deploy-api

# Builds the Go API and deploys it to the DataHub (Kathmandu) box.
#
#   GitHub runner ──ssh──► cloudflared access ──► Cloudflare ══ tunnel goserve-ktm ══► box sshd
#
# The runner never reaches the box directly: SSH rides the same Cloudflare
# Tunnel as the API (hostname ssh-goserve.sarojpaudyal.com.np). On the box,
# sshd only admits the `deploy` user on that path, and the deploy key is pinned
# by authorized_keys to a forced command (/usr/local/bin/goserve-deploy-ssh)
# that accepts a release tarball and runs migrate → switch → health check →
# automatic rollback. See infra/datahub/README.md.
#
# Secret: DEPLOY_SSH_KEY (ed25519 private key for deploy@box).

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'infra/datahub/goserve-deploy'
      - 'infra/datahub/goserve-deploy-ssh'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch: {}

concurrency:
  group: deploy-api
  cancel-in-progress: false

permissions:
  contents: read

env:
  SSH_HOST: ssh-goserve.sarojpaudyal.com.np
  API_PUBLIC_URL: https://goserve.sarojpaudyal.com.np
  CLOUDFLARED_VERSION: 2026.10.7
  CLOUDFLARED_SHA256: 1f99fb518b83dec2ba8d870a7cc991d82a77e6196295a3d2754ba17ab9f91872

jobs:
  deploy:
    name: build + deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Latest 1.26 patch: go.mod needs ≥1.26.0 and the standard-library
          # security fixes (govulncheck, 2026-11) need ≥1.26.9.
          go-version: "1.26"
          check-latest: true
          cache-dependency-path: apps/api/go.sum

      - name: Build linux/amd64 binaries
        working-directory: apps/api
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p "$RUNNER_TEMP/rel"
          go build -trimpath -ldflags="-s -w" -o "$RUNNER_TEMP/rel/server" ./cmd/server
          go build -trimpath -ldflags="-s -w" -o "$RUNNER_TEMP/rel/migrate" ./cmd/migrate
          echo "REL=$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Install cloudflared (pinned)
        run: |
          curl -fsSL -o /tmp/cloudflared \
            "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64"
          echo "${CLOUDFLARED_SHA256}  /tmp/cloudflared" | sha256sum -c -
          sudo install -m 755 /tmp/cloudflared /usr/local/bin/cloudflared

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat > ~/.ssh/config <<EOF
          Host goserve
            HostName ${SSH_HOST}
            User deploy
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            UserKnownHostsFile ${GITHUB_WORKSPACE}/infra/datahub/known_hosts
            StrictHostKeyChecking yes
            ProxyCommand /usr/local/bin/cloudflared access ssh --hostname %h
            ServerAliveInterval 15
          EOF

      - name: Deploy ${{ env.REL }}
        run: |
          ssh goserve status
          tar -C "$RUNNER_TEMP/rel" -cz server migrate | ssh goserve "deploy ${REL}"

      - name: Verify public health
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${API_PUBLIC_URL}/healthz") && [ "$code" = 200 ] && break
            sleep 3
          done
          echo "healthz: $code"; [ "$code" = 200 ]
          ssh goserve status
